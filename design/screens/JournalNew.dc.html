<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Стройова — Новий експонат</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/stroyova/tokens.css">
<link rel="stylesheet" href="ds/stroyova/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Unbounded:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: var(--font-sans); display: flex; flex-direction: column; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="height: 44px; width: 150px; border-radius: var(--radius-8); background: var(--surface-2)"></div>
    <div style="height: 120px; border-radius: var(--radius-10); background: var(--surface); border: 1px solid var(--border)"></div>
    <div style="height: 260px; border-radius: var(--radius-6); background: var(--surface); border: 1px solid var(--border)"></div>
    <div style="height: 58px; border-radius: var(--radius-10); background: var(--surface); border: 1px solid var(--border)"></div>
  </div>
  <div class="st-scrim"></div>

  <div class="st-modal-wrap">
    <section class="st-modal" role="dialog" aria-modal="true" aria-labelledby="jn-title" style="gap: 14px; padding-top: 18px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent)">
          <svg class="st-ico" width="16" height="16" viewBox="0 0 24 24" style="stroke-width: 2" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"></rect><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"></path></svg>
          Новий експонат
        </span>
        <span style="font: 500 12px/1.3 var(--font-mono); color: var(--muted)">{{j.counter}}</span>
      </div>

      <div style="align-self: center; width: 176px; padding: 2px; border-radius: var(--radius-6); border: {{j.frame}}">
        <span class="st-jr-cover" style="height: 216px; background: {{j.bg}}; padding: 16px {{j.padR}} 44px 26px">
          <span class="st-jr-label" style="font-size: 13px; padding: 7px 10px"><b>{{j.head}}</b><span>{{j.name}}</span></span>
          <sc-if value="{{s.legend}}" hint-placeholder-val="{{false}}">
            <span class="st-jr-star"><svg class="st-ico" width="18" height="18" viewBox="0 0 24 24" style="stroke-width: 2" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg></span>
          </sc-if>
          <span class="st-stamp st-stamp--dark st-stamp--hit" style="--st-rot: -7deg; --st-edge: 100deg; right: 8px; bottom: 8px">Скасовано</span>
        </span>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
        <h2 id="jn-title" style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35">{{j.full}}</h2>
        <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: {{j.rc}}">
          <sc-if value="{{s.legend}}" hint-placeholder-val="{{false}}">
            <svg class="st-ico" width="14" height="14" viewBox="0 0 24 24" style="stroke-width: 2.2" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
          </sc-if>
          {{j.rar}}
        </span>
        <p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted)">{{j.flavor}}</p>
      </div>

      <div class="st-card" style="padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-color: var(--accent)">
        <svg class="st-ico" width="18" height="18" viewBox="0 0 24 24" style="stroke-width: 2.2; color: var(--accent)" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 14px; font-weight: 500; line-height: 1.4">{{j.bonus}}</span>
          <span style="font-size: 12px; color: var(--muted)">{{j.bonusNote}}</span>
        </div>
      </div>

      <sc-if value="{{s.series}}" hint-placeholder-val="{{false}}">
        <div role="status" style="padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-radius: var(--radius-10); border: 1.5px solid var(--accent); background: var(--bg)">
          <span style="flex: 1; min-width: 0; font-size: 13px; line-height: 1.45">{{j.seriesText}}</span>
          <span class="st-stamp st-stamp--s st-stamp--dark" style="--st-rot: 5deg; --st-edge: 80deg; flex: none">Виконано</span>
        </div>
      </sc-if>

      <span style="font-size: 12px; line-height: 1.4; color: var(--muted); text-align: center">{{j.from}}</span>

      <button class="st-btn st-btn--primary st-btn--l">{{j.cta}}</button>
      <a href="JournalDetail.dc.html" class="st-btn st-btn--neutral st-btn--m" style="color: var(--text)">Деталі експоната</a>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["звичайний","рідкісний","легендарний","№ 9: бригада, з 24","№ 12: серію «Особовий склад» зібрано","№ 16: серію «Транспорт і склад» зібрано","№ 20: серію «Побут» зібрано","№ 24: серію «Земля» зібрано"],"default":"звичайний","section":"Стан"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var st = this.props.state ?? "звичайний";
    var D = {
      "звичайний": {
        counter: "1 з 3 нових · у музеї 1 з 8",
        head: "Книга", name: "обліку видавання мила, миття в лазні та заміни білизни",
        full: "Книга обліку видавання мила, миття в лазні та заміни білизни",
        bg: "var(--cover-olive)", frame: "0", padR: "12px",
        rar: "Звичайний", rc: "var(--rarity-common)",
        flavor: "Мило видавали на одну лазню на тиждень. Кожен шматок записували.",
        bonus: "+5% до швидкості Стройової частини", bonusNote: "Уже діє. Назавжди.",
        from: "Скасовано першою цифровізацією",
        cta: "Наступний експонат"
      },
      "рідкісний": {
        counter: "У музеї 4 з 8",
        head: "Книга", name: "обліку призів і подарунків",
        full: "Книга обліку призів і подарунків",
        bg: "var(--cover-olive)", frame: "0", padR: "12px",
        rar: "Рідкісний", rc: "var(--rarity-rare)",
        flavor: "Скасована разом з актом передачі перехідного призу. Приз нікому не передали.",
        bonus: "Акти на подарунки волонтерів ідуть конвеєром на 10% швидше", bonusNote: "Уже діє. Назавжди.",
        from: "Скасовано телеграмою згори",
        cta: "Добре"
      },
      "легендарний": {
        counter: "У музеї 8 з 8",
        head: "Книга", name: "обліку експонатів музеїв, кімнат бойової слави",
        full: "Книга обліку експонатів музеїв, кімнат бойової слави",
        bg: "var(--cover-black)", frame: "2px solid var(--accent)", padR: "30px",
        rar: "Легендарний", rc: "var(--rarity-legend)",
        flavor: "Скасована в одному переліку з книгою обліку мила. Тепер сама експонат.",
        bonus: "×2 до бонусу всіх інших журналів", bonusNote: "Серію зібрано. Уже діє.",
        from: "Зібрано сім інших журналів",
        cta: "Добре"
      }
    };
    var NEW = {"№ 9: бригада, з 24": {"counter": "У музеї 9 з 24", "head": "Іменний", "name": "список для проведення вечірньої повірки", "full": "Іменний список для проведення вечірньої повірки", "bg": "var(--cover-navy)", "frame": "0", "padR": "12px", "rar": "Звичайний", "rc": "var(--rarity-common)", "flavor": "Список зачитували щовечора вголос. З понеділка в ньому нічого не змінилось. Читали все одно повністю.", "bonus": "+5% до потоку «Накази по частині»", "bonusNote": "Уже діє. Назавжди.", "cta": "Добре", "seriesText": "", "from": "Перша цифровізація в бригаді"}, "№ 12: серію «Особовий склад» зібрано": {"counter": "У музеї 12 з 24", "head": "Журнал", "name": "контролю за станом обліку особового складу", "full": "Журнал контролю за станом обліку особового складу", "bg": "var(--cover-navy)", "frame": "0", "padR": "12px", "rar": "Рідкісний", "rc": "var(--rarity-rare)", "flavor": "У журналі перевіряли, чи правильно ведуть інші журнали. Інших журналів більше немає. Перевіряти нічого.", "bonus": "−10% ціни пунктів чекліста", "bonusNote": "Уже діє. Назавжди.", "cta": "Добре", "seriesText": "Серію «Особовий склад» зібрано. +5% до всіх підписів. Уже діє.", "from": "Підсумкова перевірка бригади"}, "№ 16: серію «Транспорт і склад» зібрано": {"counter": "У музеї 16 з 24", "head": "Книга-рознарядка", "name": "на видавання запасних частин, інструменту і приладдя розсипом", "full": "Книга-рознарядка на видавання запасних частин, інструменту і приладдя розсипом", "bg": "var(--cover-olive)", "frame": "0", "padR": "12px", "rar": "Рідкісний", "rc": "var(--rarity-rare)", "flavor": "Розсипом означає поштучно. Кожен болт отримував рядок у книзі й окрему рознарядку.", "bonus": "+10% до ланки «Нарада»", "bonusNote": "Уже діє. Назавжди.", "cta": "Добре", "seriesText": "Серію «Транспорт і склад» зібрано. +5% до всіх підписів. Уже діє.", "from": "Перевірка зі столиці"}, "№ 20: серію «Побут» зібрано": {"counter": "У музеї 20 з 24", "head": "Книга", "name": "штатно-посадового обліку особового складу", "full": "Книга штатно-посадового обліку особового складу", "bg": "var(--cover-brown)", "frame": "0", "padR": "12px", "rar": "Рідкісний", "rc": "var(--rarity-rare)", "flavor": "Хто на якій посаді за штатом і хто насправді. Дві графи, які мали збігатися, тепер в одній вкладці.", "bonus": "+10% до часу служби подарунків Ліни", "bonusNote": "Уже діє. Назавжди.", "cta": "Добре", "seriesText": "Серію «Побут» зібрано. +5% до всіх підписів. Уже діє.", "from": "Аудит усього"}, "№ 24: серію «Земля» зібрано": {"counter": "У музеї 24 з 24", "head": "Журнал", "name": "обліку журналів обліку", "full": "Журнал обліку журналів обліку", "bg": "var(--cover-black)", "frame": "2px solid var(--accent)", "padR": "30px", "rar": "Легендарний", "rc": "var(--rarity-legend)", "flavor": "Сюди вписували кожен журнал, книгу й відомість. Останній запис зроблено про сам журнал. Графа «Підстава для скасування» порожня.", "bonus": "×2 до бонусів журналів № 9–23", "bonusNote": "Остання книга. Уже діє.", "cta": "Добре", "seriesText": "Серію «Земля» зібрано. +5% до всіх підписів. Уже діє.", "from": "Остання книга"}};
    for (var k in NEW) D[k] = NEW[k];
    var j = D[st] || D["звичайний"];
    if (j.seriesText === undefined) j.seriesText = '';
    return { j: j, s: { legend: j.rar === "Легендарний", series: !!j.seriesText } };
  }
}
</script>
</body>
</html>
