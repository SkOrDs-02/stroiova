<!doctype html>
<html lang="uk">
<head>

<link rel="stylesheet" href="ds/stroyova/tokens.css">
<link rel="stylesheet" href="ds/stroyova/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>

<style>

<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: var(--font-sans); display: flex; flex-direction: column; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 10px">

        <span style="font-size: 12px; color: var(--muted)">1-й батальйон · бліндаж</span>
        <span style="font-family: var(--font-display); font-weight: 500; font-size: 30px; line-height: 1.15">186 412</span>
      </div>
      <span style="width: 64px; height: 44px; border-radius: var(--radius-8); border: 1px solid var(--accent)"></span>
      <span style="width: 44px; height: 44px; border-radius: var(--radius-10); background: var(--surface); border: 1px solid var(--border)"></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><span style="height: 46px; border-radius: var(--radius-10); background: var(--surface); border: 1px solid var(--border)"></span><span style="height: 46px; border-radius: var(--radius-10); background: var(--surface); border: 1px solid var(--border)"></span><span style="height: 46px; border-radius: var(--radius-10); background: var(--surface); border: 1px solid var(--border)"></span></div>
    <div style="height: 58px; border-radius: var(--radius-10); background: var(--surface); border: 1px solid var(--border)"></div>
    <div style="height: 58px; border-radius: var(--radius-10); background: var(--surface); border: 1px solid var(--border)"></div>
    <div style="height: 58px; border-radius: var(--radius-10); background: var(--surface); border: 1px solid var(--border)"></div>
    <div style="height: 58px; border-radius: var(--radius-10); background: var(--surface); border: 1px solid var(--border)"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>

  <div class="st-sheet" role="dialog" aria-modal="true" aria-labelledby="mn-title">
    <div class="st-sheet-grab" aria-hidden="true"></div>
    <div class="st-sheet-head">
      <div class="st-sheet-title">
        <h2 class="st-h2" id="mn-title">Меню</h2>
        <p class="st-sub" style="font-size: 12px">{{who}}</p>
      </div>
      <a class="st-iconbtn st-iconbtn--bare" href="Main.dc.html" aria-label="Закрити"><svg class="st-ico" width="20" height="20" viewBox="0 0 24 24" style="stroke-width: 2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <nav aria-label="Меню" style="display: flex; flex-direction: column; gap: 6px">
      <a href="Profile.dc.html" class="st-card" style="display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 12px 8px 10px">
        <span class="st-unit-plate"><svg class="st-ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"></path><path d="M9 8a3 3 0 1 0 6 0a3 3 0 1 0-6 0M8 16a4 4 0 0 1 8 0"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Особова справа</span><span style="font-size: 12px; color: var(--muted)">Позивний, посада, лічильники, щоденник</span></span>
        <svg class="st-ico" width="18" height="18" viewBox="0 0 24 24" style="color: var(--muted)" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="Curios.dc.html" class="st-card" aria-label="{{curAria}}" style="display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 12px 8px 10px">
        <span class="st-unit-plate"><svg class="st-ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5M9 7h6M9 11h4"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 15px; font-weight: 500">Журнал курйозів</span><sc-if value="{{isNew}}" hint-placeholder-val="{{true}}"><span class="st-tag st-tag--fill">нове</span></sc-if></span><span style="font-size: 12px; color: var(--muted)">{{curSub}}</span></span>
        <svg class="st-ico" width="18" height="18" viewBox="0 0 24 24" style="color: var(--muted)" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="Settings.dc.html" class="st-card" style="display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 12px 8px 10px">
        <span class="st-unit-plate"><svg class="st-ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path><path d="M14 4v4M8 10v4M16 16v4"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Налаштування</span><span style="font-size: 12px; color: var(--muted)">Звук, сповіщення, статистика, покупки</span></span>
        <svg class="st-ico" width="18" height="18" viewBox="0 0 24 24" style="color: var(--muted)" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="About.dc.html" class="st-card" style="display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 12px 8px 10px">
        <span class="st-unit-plate"><svg class="st-ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0"></path><path d="M12 11v6M12 7.5v.01"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Про гру</span><span style="font-size: 12px; color: var(--muted)">Хто робить, приватність, ліцензії</span></span>
        <svg class="st-ico" width="18" height="18" viewBox="0 0 24 24" style="color: var(--muted)" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </nav>

    <span style="align-self: center; font: 400 12px/1.4 var(--font-mono); color: var(--muted)">Stroiova 1.0.0 · прогрес зберігається на телефоні</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["нове в курйозах","без нового"],"default":"нове в курйозах","section":"Стан"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var st = this.props.state ?? 'нове в курйозах';
    var isNew = st === 'нове в курйозах';
    return {
      who: 'Ексель · начальник стройової частини',
      isNew: isNew,
      curSub: isNew ? 'Новий запис: списано раніше, ніж поставлено на облік' : 'Телеграми й списані дрони · 14 записів',
      curAria: isNew ? 'Журнал курйозів, є новий запис' : 'Журнал курйозів, 14 записів'
    };
  }
}
</script>
</body>
</html>
