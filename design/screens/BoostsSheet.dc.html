<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Стройова — Множники</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/stroyova/tokens.css">
<link rel="stylesheet" href="ds/stroyova/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Unbounded:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: var(--font-sans); display: flex; flex-direction: column; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: flex-start; gap: 8px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: var(--muted)">1-й батальйон · бліндаж</span>
        <span style="font-family: var(--font-display); font-weight: 500; font-size: 30px; line-height: 1.15">186 412</span>
      </div>
      <span style="width: 64px; height: 44px; border-radius: var(--radius-8); border: 1px solid var(--accent)"></span>
      <span style="width: 44px; height: 44px; border-radius: var(--radius-10); background: var(--surface); border: 1px solid var(--border)"></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><span style="height: 46px; border-radius: var(--radius-10); background: var(--surface); border: 1px solid var(--border)"></span><span style="height: 46px; border-radius: var(--radius-10); background: var(--surface); border: 1px solid var(--border)"></span><span style="height: 46px; border-radius: var(--radius-10); background: var(--surface); border: 1px solid var(--border)"></span></div>
    <div style="height: 58px; border-radius: var(--radius-10); background: var(--surface); border: 1px solid var(--border)"></div>
    <div style="height: 58px; border-radius: var(--radius-10); background: var(--surface); border: 1px solid var(--border)"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>

  <div class="st-sheet" role="dialog" aria-modal="true" aria-labelledby="bs-title" style="max-height: 90%">
    <div class="st-sheet-grab" aria-hidden="true"></div>
    <div class="st-sheet-head">
      <div class="st-unit-plate"><svg class="st-ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"></path></svg></div>
      <div class="st-sheet-title">
        <h2 class="st-h2" id="bs-title">Множники</h2>
        <p class="st-sub" style="font-size: 12px">Множать дохід конвеєра й печатку</p>
      </div>
      <a class="st-iconbtn st-iconbtn--bare" href="Main.dc.html" aria-label="Закрити"><svg class="st-ico" width="20" height="20" viewBox="0 0 24 24" style="stroke-width: 2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin: 0 -4px; padding: 0 4px">
      <div role="group" aria-label="Разом {{total}} {{totalSub}}" style="display: flex; align-items: baseline; gap: 10px">
        <span style="font-size: 13px; color: var(--muted)">Разом</span>
        <span style="font-family: var(--font-display); font-weight: 500; font-size: 30px; line-height: 1.15; color: var(--accent)">{{total}}</span>
        <span style="font-size: 13px; color: var(--muted)">{{totalSub}}</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font: 500 12px/1.35 var(--font-mono); color: var(--muted)">Діють зараз</span>
        <sc-for list="{{act}}" as="r" hint-placeholder-count="2">
          <div class="st-card" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 7px 12px 7px 10px">
            <div class="st-unit-plate"><svg class="st-ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.d1}}"></path><path d="{{r.d2}}"></path></svg></div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 14px; font-weight: 500; line-height: 1.3">{{r.name}}</span>
              <span style="font-size: 12px; line-height: 1.35; color: var(--muted)">{{r.sub}}</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none">
              <b style="font: 600 15px/1.1 var(--font-mono); color: var(--accent)">{{r.v}}</b>
              <span style="font: 500 12px/1.2 var(--font-mono); color: var(--muted); white-space: nowrap">{{r.t}}</span>
            </div>
          </div>
        </sc-for>
      </div>

      <sc-if value="{{hasIdle}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font: 500 12px/1.35 var(--font-mono); color: var(--muted)">Ще бувають</span>
          <sc-for list="{{idle}}" as="r" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 12px 6px 10px; background: var(--surface-2); border: 1px dashed var(--border); border-radius: var(--radius-10)">
              <div style="width: 36px; height: 36px; flex: none; border-radius: var(--radius-8); border: 1px dashed var(--border); color: var(--muted); display: flex; align-items: center; justify-content: center"><svg class="st-ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.d1}}"></path><path d="{{r.d2}}"></path></svg></div>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 14px; line-height: 1.3">{{r.name}}</span>
                <span style="font-size: 12px; line-height: 1.35; color: var(--muted)">{{r.sub}}</span>
              </div>
              <b style="flex: none; font: 600 14px/1.1 var(--font-mono); color: var(--muted)">{{r.v}}</b>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-if value="{{b.ready}}" hint-placeholder-val="{{true}}">
        <button class="st-btn st-btn--primary st-btn--l" aria-label="{{b.label}}. Реклама 30 секунд"><svg class="st-ico" width="20" height="20" viewBox="0 0 24 24" style="stroke-width: 2" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>{{b.label}}</button>
      </sc-if>
      <sc-if value="{{b.take}}" hint-placeholder-val="{{false}}">
        <button class="st-btn st-btn--primary st-btn--l" aria-label="{{b.label}}. Без реклами"><svg class="st-ico" width="20" height="20" viewBox="0 0 24 24" style="stroke-width: 2.4" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>{{b.label}}</button>
      </sc-if>
      <sc-if value="{{b.loading}}" hint-placeholder-val="{{false}}">
        <button class="st-btn st-btn--off st-btn--l" aria-disabled="true" aria-busy="true"><span class="st-dots" aria-hidden="true"><i></i><i></i><i></i></span>Завантажуємо ролик</button>
      </sc-if>
      <sc-if value="{{b.na}}" hint-placeholder-val="{{false}}">
        <button class="st-btn st-btn--off st-btn--l" aria-disabled="true"><svg class="st-ico" width="20" height="20" viewBox="0 0 24 24" style="stroke-width: 2" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>Ролика немає</button>
      </sc-if>
      <sc-if value="{{b.limit}}" hint-placeholder-val="{{false}}">
        <button class="st-btn st-btn--off st-btn--l" aria-disabled="true"><svg class="st-ico" width="20" height="20" viewBox="0 0 24 24" style="stroke-width: 2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Ліміт на сьогодні</button>
      </sc-if>
      <sc-if value="{{b.cap}}" hint-placeholder-val="{{false}}">
        <button class="st-btn st-btn--off st-btn--l" aria-disabled="true"><svg class="st-ico" width="20" height="20" viewBox="0 0 24 24" style="stroke-width: 2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Межа: 12 год</button>
      </sc-if>
      <span class="st-btn-note">{{b.note}}</span>
      <sc-if value="{{shopLink}}" hint-placeholder-val="{{true}}">
        <a href="Shop.dc.html" class="st-btn st-btn--quiet" style="align-self: center">Постійний ×1,3 - у магазині</a>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["буст з таймером","лише постійні","накопичено 12 год","Без реклами: Забрати","ролик вантажиться","реклама недоступна","ліміт на сьогодні","кілька джерел ×8","усі джерела"],"default":"буст з таймером","section":"Стан"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var st = this.props.state ?? 'буст з таймером';
    var NB = ' ';
    function nb(s) {
      return String(s == null ? '' : s).replace(/(\d) (?=\d)/g, '$1' + NB).replace(/ (тис\.|млн|хв|год|дн)/g, NB + '$1');
    }
    var I = {
      drone: ['M2.5 5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M16.5 5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M2.5 19a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M16.5 19a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0', 'M7 7l3 3M17 7l-3 3M7 17l3-3M17 17l-3-3M10 10h4v4h-4z'],
      ad: ['M8 5v14l11-7z', ''],
      insp: ['M9 3h6v3H9zM7 4.5H5V21h14V4.5h-2', 'M9 14l2 2 4-4'],
      dig: ['M7 7h10v10H7z', 'M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4'],
      noad: ['M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0', 'M8 12l3 3 5-6'],
      mus: ['M4 4h16v4H4z', 'M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4'],
      fuel: ['M13 3L5 14h6l-1 7 8-11h-6z', '']
    };
    function R(ic, name, sub, v, t) { return { d1: I[ic][0], d2: I[ic][1], name: name, sub: sub, v: v, t: nb(t || '') }; }

    var AD = R('ad', 'Буст за рекламу', 'Накопичується до 12 год', '×2', 'ще 3:41:12');
    var FUEL = R('fuel', 'Повний бак', 'Генератор гуде, Дід гріє фарбу', '×1,25', 'ще 5 год');
    var I_BIRD = R('drone', 'Пташка в небі', 'Поки служить подарунок Ліни', '×2');
    var I_INSP = R('insp', 'Перевірку пройдено', 'На 2 год після перевірки без зауважень', '×3');
    var I_DIG = R('dig', 'Цифрові бали', '+2% за бал, назавжди. Після цифровізації', '+2%');
    var I_AD = R('ad', 'Буст за рекламу', '4 год за ролик, накопичується до 12 год', '×2');
    var I_MUS = R('mus', 'Музей журналів', 'Бонуси окремим ланкам · 0 з 8', '+5%');
    var MUS = R('mus', 'Музей журналів', 'Бонуси окремим ланкам: Стройовій, паперу, Накладним', '3 з 8', 'окремо');
    var DIG38 = R('dig', 'Цифрові бали', '38 балів · +2% за бал', '×1,76', 'назавжди');
    var NOAD = R('noad', 'Без реклами', 'Покупку зараховано', '×1,3', 'назавжди');

    var ready = { kind: 'ready', label: 'Додати 4 год до ×2', note: 'Реклама 30 секунд · сьогодні ще 2 з 3' };
    var P = {
      'буст з таймером': { total: '×2,5', totalSub: 'з двох джерел', act: [AD, FUEL], idle: [I_BIRD, I_INSP, I_DIG, I_MUS], b: ready, shop: true },
      'лише постійні': { total: '×2,2', totalSub: 'з двох джерел', act: [DIG38, FUEL, MUS], idle: [I_AD, I_BIRD, I_INSP], b: { kind: 'ready', label: 'Буст ×2 на 4 год', note: 'Реклама 30 секунд · сьогодні ще 3 з 3' }, shop: true },
      'накопичено 12 год': { total: '×2,5', totalSub: 'з двох джерел', act: [R('ad', 'Буст за рекламу', 'Межа накопичення: 12 год', '×2', 'ще 11:58:40'), FUEL], idle: [I_BIRD, I_INSP, I_DIG, I_MUS], b: { kind: 'cap', note: 'Буст уже на 12 год, більше не накопичується.' }, shop: true },
      'Без реклами: Забрати': { total: '×3,25', totalSub: 'з трьох джерел', act: [NOAD, R('ad', 'Буст без перегляду', 'Ті самі ліміти, що й у ролика', '×2', 'ще 3:41:12'), FUEL], idle: [I_BIRD, I_INSP, I_DIG], b: { kind: 'take', label: 'Забрати +4 год до ×2', note: 'Без реклами: без перегляду · сьогодні ще 2 з 3' }, shop: false },
      'ролик вантажиться': { total: '×2,2', totalSub: 'з двох джерел', act: [DIG38, FUEL, MUS], idle: [I_AD, I_BIRD, I_INSP], b: { kind: 'loading', note: 'Зазвичай кілька секунд' }, shop: true },
      'реклама недоступна': { total: '×2,2', totalSub: 'з двох джерел', act: [DIG38, FUEL, MUS], idle: [I_AD, I_BIRD, I_INSP], b: { kind: 'na', note: 'Немає зв’язку. Гра працює далі, спробуй пізніше.' }, shop: true },
      'ліміт на сьогодні': { total: '×2,5', totalSub: 'з двох джерел', act: [R('ad', 'Буст за рекламу', 'Накопичується до 12 год', '×2', 'ще 0:52:10'), FUEL], idle: [I_BIRD, I_INSP, I_DIG, I_MUS], b: { kind: 'limit', note: '3 з 3 використано. Нові спроби завтра.' }, shop: true },
      'кілька джерел ×8': { total: '×8', totalSub: 'з чотирьох джерел', act: [R('drone', 'Пташка в небі', 'Квадрокоптер служить', '×2', 'ще 9 год 15 хв'), AD, R('dig', 'Цифрові бали', '30 балів · +2% за бал', '×1,6', 'назавжди'), FUEL, R('mus', 'Музей журналів', 'Бонуси окремим ланкам', '2 з 8', 'окремо')], idle: [I_INSP], b: ready, shop: true },
      'усі джерела': { total: '×34,3', totalSub: 'з шести джерел', act: [R('drone', 'Пташка в небі', 'Квадрокоптер служить', '×2', 'ще 9 год 15 хв'), R('ad', 'Буст без перегляду', 'Накопичується до 12 год', '×2', 'ще 3:41:12'), R('insp', 'Перевірку пройдено', 'Зауважень немає', '×3', 'ще 1 год 12 хв'), DIG38, NOAD, FUEL, MUS], idle: [], b: { kind: 'take', label: 'Забрати +4 год до ×2', note: 'Без реклами: без перегляду · сьогодні ще 2 з 3' }, shop: false }
    };
    var S = P[st] || P['буст з таймером'];
    var k = S.b.kind;
    return {
      total: S.total, totalSub: S.totalSub,
      act: S.act, idle: S.idle, hasIdle: S.idle.length > 0,
      b: { ready: k === 'ready', take: k === 'take', loading: k === 'loading', na: k === 'na', limit: k === 'limit', cap: k === 'cap', label: S.b.label || '', note: nb(S.b.note) },
      shopLink: S.shop
    };
  }
}
</script>
</body>
</html>
