<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["репліка 1","відповідь гравця","репліка 3","остання репліка"],"default":"репліка 1","section":"Стан"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var opts = ["репліка 1", "відповідь гравця", "репліка 3", "остання репліка"];
    var st = this.props.state ?? "репліка 1";
    var base = opts.indexOf(st);
    if (base < 0) base = 0;
    var ls = this.state || {};
    var step = (ls.src === st && typeof ls.step === "number") ? ls.step : base;
    if (step > 3) step = 3;
    return {
      s: { l2: step >= 1, l3: step >= 2, l4: step >= 3, more: step < 3, last: step >= 3 },
      next: function () { self.setState({ src: st, step: step + 1 }); }
    };
  }
}
</script>
