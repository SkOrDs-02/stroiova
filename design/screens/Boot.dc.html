<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Стройова — Завантаження</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/stroyova/tokens.css">
<link rel="stylesheet" href="ds/stroyova/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Unbounded:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: var(--font-sans); display: flex; flex-direction: column; overflow: hidden">

  <sc-if value="{{s.splash}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; display: flex; align-items: center; justify-content: center">
      <svg width="220" height="198" viewBox="0 0 200 180" role="img" aria-label="Кіт Сейф спить на сейфі. Заглушка кодом, фінальний малюнок робить ілюстратор">
        <rect x="48" y="166" width="16" height="8" rx="1" style="fill: var(--bg-deep)"></rect>
        <rect x="136" y="166" width="16" height="8" rx="1" style="fill: var(--bg-deep)"></rect>
        <rect x="40" y="78" width="120" height="92" rx="6" style="fill: var(--scene-l1-olive)"></rect>
        <rect x="50" y="88" width="100" height="72" rx="3" style="fill: none; stroke: var(--bg-deep); stroke-width: 3"></rect>
        <rect x="44" y="98" width="8" height="12" rx="1" style="fill: var(--bg-deep)"></rect>
        <rect x="44" y="138" width="8" height="12" rx="1" style="fill: var(--bg-deep)"></rect>
        <circle cx="100" cy="124" r="15" style="fill: var(--scene-l1-metal); stroke: var(--bg-deep); stroke-width: 3"></circle>
        <path d="M100 124l7-7" style="fill: none; stroke: var(--bg-deep); stroke-width: 3; stroke-linecap: round"></path>
        <path d="M100 106v3M118 124h-3M100 142v-3M82 124h3" style="fill: none; stroke: var(--bg-deep); stroke-width: 2; stroke-linecap: round"></path>
        <rect x="128" y="118" width="12" height="12" rx="2" style="fill: var(--bg-deep)"></rect>
        <rect x="54" y="72" width="92" height="7" rx="1" style="fill: var(--paper-3)"></rect>
        <rect x="58" y="67" width="86" height="6" rx="1" style="fill: var(--paper)"></rect>
        <path d="M62 66c-14 2-16 10-6 13" style="fill: none; stroke: var(--muted); stroke-width: 7; stroke-linecap: round"></path>
        <ellipse cx="96" cy="54" rx="40" ry="15" style="fill: var(--muted)"></ellipse>
        <ellipse cx="112" cy="64" rx="12" ry="4" style="fill: var(--paper-4)"></ellipse>
        <circle cx="134" cy="48" r="15" style="fill: var(--muted)"></circle>
        <path d="M124 39l2-15 10 9z" style="fill: var(--muted)"></path>
        <path d="M138 34l10-9 2 15z" style="fill: var(--muted)"></path>
        <path d="M128 49q3 3 6 0" style="fill: none; stroke: var(--bg-deep); stroke-width: 2; stroke-linecap: round"></path>
        <path d="M138 49q3 3 6 0" style="fill: none; stroke: var(--bg-deep); stroke-width: 2; stroke-linecap: round"></path>
      </svg>
    </div>
  </sc-if>

  <sc-if value="{{s.short}}" hint-placeholder-val="{{true}}">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center">
      <span style="font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1.15; letter-spacing: 1px; color: var(--accent)">Стройова</span>
    </div>
  </sc-if>

  <sc-if value="{{s.long}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 20px">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 32px; padding-bottom: 32px; width: 100%">
        <span style="font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1.15; letter-spacing: 1px; color: var(--accent)">Стройова</span>
        <button onClick="{{nextTruth}}" aria-label="Наступна неписана істина" style="width: 310px; padding: 0; border: 0; background: transparent; text-align: left">
          <article class="st-paper st-paper--card" style="transform: rotate(-1.5deg); gap: 8px; box-shadow: var(--shadow-stack)">
            <span class="st-doc-meta">Неписана істина № {{truthNo}}</span>
            <p class="st-doc-body" style="font-size: 16px; line-height: 1.5">{{truth}}</p>
          </article>
        </button>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 56px">
        <span role="status" style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted)">
          <span class="st-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          Завантаження
        </span>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{s.migration}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 20px">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 32px; padding-bottom: 32px; width: 100%">
        <span style="font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1.15; letter-spacing: 1px; color: var(--accent)">Стройова</span>
        <div style="position: relative; isolation: isolate; width: 316px; padding: 4px 6px 8px 2px; box-sizing: border-box">
          <div class="st-paper-under" style="background: var(--paper-3); transform: rotate(2.5deg); inset: 10px 2px 2px 12px"></div>
          <article class="st-paper st-paper--card" role="status" style="gap: 10px">
            <span class="st-doc-meta">Книга обліку особового складу · арк. 47</span>
            <p class="st-doc-body" style="font-size: 16px; line-height: 1.4">Переносимо особову справу…</p>
            <p class="st-doc-body" style="font-size: 14px; line-height: 1.5; color: var(--ink-2)">Гра оновилася. Справу переписуємо в нову книгу обліку, аркуші не губляться.</p>
            <span class="st-dots" aria-hidden="true" style="color: var(--pen); margin-top: 2px"><i></i><i></i><i></i></span>
          </article>
        </div>
      </div>
      <div style="flex: 1"></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["коротке","довге","міграція","сплеш"],"default":"коротке","section":"Стан"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.props.state ?? 'коротке';
    var truths = [
      { no: '14', text: 'Що не підшито, того не було.' },
      { no: '22', text: 'Строк виконання завжди вчора. Завтра теж.' },
      { no: '31', text: 'Що не зареєстровано, того не існує. Кіт Сейф не зареєстрований.' }
    ];
    var i = (this.state && this.state.truth) || 0;
    var t = truths[i % truths.length];
    return {
      s: { splash: st === 'сплеш', short: st === 'коротке', long: st === 'довге', migration: st === 'міграція' },
      truth: t.text,
      truthNo: t.no,
      nextTruth: function () { self.setState({ truth: i + 1 }); }
    };
  }
}
</script>
</body>
</html>
