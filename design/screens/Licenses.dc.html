<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Стройова — Ліцензії</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/stroyova/tokens.css">
<link rel="stylesheet" href="ds/stroyova/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Unbounded:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: var(--font-sans); display: flex; flex-direction: column; overflow: hidden">

  <header style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; height: 52px; margin-top: 18px; padding: 0 20px 0 8px">
    <a href="About.dc.html" aria-label="Назад до «Про гру»" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: var(--text)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.25">Ліцензії</h1>
  </header>

  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 20px">

    <section aria-labelledby="l-fonts" style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
        <h2 id="l-fonts" style="margin: 0; font-size: 13px; font-weight: 500; line-height: 1.5; color: var(--muted)">Шрифти</h2>
        <span style="font-family: var(--font-mono); font-size: 12px; color: var(--muted)">SIL OFL 1.1</span>
      </div>
      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden">
        <sc-for list="{{fonts}}" as="f" hint-placeholder-count="4">
          <button style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 7px 12px; border: 0; border-top: {{f.divider}}; background: transparent; color: var(--text); text-align: left">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 500; line-height: 1.3">{{f.name}}</span>
              <span style="font-size: 12px; line-height: 1.4; color: var(--muted)">{{f.note}}</span>
            </span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </sc-for>
      </div>
    </section>

    <section aria-labelledby="l-sounds" style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
        <h2 id="l-sounds" style="margin: 0; font-size: 13px; font-weight: 500; line-height: 1.5; color: var(--muted)">Звуки</h2>
        <span style="font-family: var(--font-mono); font-size: 12px; color: var(--muted)">CC0 1.0</span>
      </div>
      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden">
        <sc-for list="{{sounds}}" as="f" hint-placeholder-count="2">
          <button style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 7px 12px; border: 0; border-top: {{f.divider}}; background: transparent; color: var(--text); text-align: left">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 500; line-height: 1.3">{{f.name}}</span>
              <span style="font-size: 12px; line-height: 1.4; color: var(--muted)">{{f.note}}</span>
            </span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </sc-for>
      </div>
      <p style="margin: 0; font-size: 12px; line-height: 1.4; color: var(--muted)">CC0 не вимагає підпису. Підписуємо однаково.</p>
    </section>

    <section aria-labelledby="l-libs" style="display: flex; flex-direction: column; gap: 6px">
      <h2 id="l-libs" style="margin: 0; font-size: 13px; font-weight: 500; line-height: 1.5; color: var(--muted)">Бібліотеки</h2>
      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden">
        <sc-for list="{{libs}}" as="f" hint-placeholder-count="4">
          <button style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 7px 12px; border: 0; border-top: {{f.divider}}; background: transparent; color: var(--text); text-align: left">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-family: var(--font-mono); font-size: 14px; font-weight: 600; line-height: 1.3">{{f.name}}</span>
              <span style="font-size: 12px; line-height: 1.4; color: var(--muted)">{{f.note}}</span>
            </span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["звичайний"],"default":"звичайний","section":"Стан"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function rows(list) {
      return list.map(function (it, i) {
        return { name: it[0], note: it[1], divider: i === 0 ? '0' : '1px solid var(--border)' };
      });
    }
    return {
      fonts: rows([
        ['Unbounded', '© The Unbounded Project Authors'],
        ['IBM Plex Sans, IBM Plex Mono', '© IBM Corp.'],
        ['Caveat', '© The Caveat Project Authors'],
        ['[Stroiova Typewriter]', 'Змінена версія TT2020 Style E, © Fredrick R. Brennan. Обрізана до потрібних знаків, тож за умовами OFL має власну назву.']
      ]),
      sounds: rows([
        ['Kenney', 'Звуки інтерфейсу'],
        ['Freesound', 'Записи з ліцензією CC0: [список авторів]']
      ]),
      libs: rows([
        ['MIT', 'React Native, Expo, React Native Skia, Reanimated, Zustand, react-native-mmkv, break_infinity.js, RevenueCat, PostHog, Sentry'],
        ['BSD-3-Clause', 'Skia, MMKV'],
        ['Apache 2.0', 'React Native Google Mobile Ads'],
        ['ISC', 'Lucide, іконки']
      ])
    };
  }
}
</script>
</body>
</html>
