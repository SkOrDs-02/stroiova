<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Стройова — Щоденник стройовика</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/stroyova/tokens.css">
<link rel="stylesheet" href="ds/stroyova/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Unbounded:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: var(--font-sans); display: flex; flex-direction: column; overflow: hidden">

  <header style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; height: 52px; margin-top: 18px; padding: 0 20px 0 8px">
    <a href="Profile.dc.html" aria-label="Назад до особової справи" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: var(--text)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="flex: 1; min-width: 0; margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.25">Щоденник стройовика</h1>
    <span style="font: 500 12px/1.3 var(--font-mono); color: var(--muted); white-space: nowrap">{{count}}</span>
  </header>

  <sc-if value="{{s.empty}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 32px 80px; text-align: center">
      <svg aria-hidden="true" width="132" height="104" viewBox="0 0 132 104">
        <rect x="18" y="14" width="96" height="80" rx="4" style="fill: var(--cover-olive)"></rect>
        <rect x="26" y="10" width="88" height="80" rx="3" style="fill: var(--paper-2)"></rect>
        <rect x="30" y="6" width="88" height="80" rx="3" style="fill: var(--paper)"></rect>
        <path d="M42 26h62M42 38h62M42 50h62M42 62h62M42 74h40" style="stroke: var(--paper-line); stroke-width: 2; stroke-linecap: round"></path>
        <path d="M36 12v70" style="stroke: var(--paper-rule); stroke-width: 1.5; stroke-dasharray: 3 4"></path>
        <rect x="96" y="58" width="6" height="40" rx="2" transform="rotate(32 99 78)" style="fill: var(--pen)"></rect>
      </svg>
      <p style="margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 17px; line-height: 1.4">Поки що нічого. Перший рядок з’явиться завтра.</p>
    </div>
  </sc-if>

  <sc-if value="{{s.list}}" hint-placeholder-val="{{true}}">
    <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 14px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <section aria-label="{{g.name}}" style="display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="font: 500 12px/1.3 var(--font-mono); color: {{g.color}}; white-space: nowrap">{{g.name}}</span>
            <span aria-hidden="true" style="flex: 1; border-top: 1px dashed var(--border)"></span>
          </div>
          <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
            <sc-for list="{{g.items}}" as="it" hint-placeholder-count="5">
              <li style="display: flex; flex-direction: column; gap: 2px">
                <span style="font: 500 12px/1.3 var(--font-mono); color: var(--muted)">День {{it.n}} · {{it.date}}</span>
                <span style="font-size: 15px; line-height: 1.45">{{it.text}}</span>
              </li>
            </sc-for>
          </ol>
        </section>
      </sc-for>
    </main>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["порожньо","список","тиждень тиші"],"default":"список","section":"Стан"},"gender":{"editor":"enum","options":["він","вона"],"default":"він","section":"Стан"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var st = this.props.state ?? 'список';
    var she = (this.props.gender ?? 'він') === 'вона';
    function g(t) { return t.replace(/\{m:([^|}]*)\|f:([^}]*)\}/g, function (_, m, f) { return she ? f : m; }); }
    function date(n) {
      var d = new Date(Date.UTC(2026, 8, 25 + n - 1));
      var dd = String(d.getUTCDate()).padStart(2, '0'), mm = String(d.getUTCMonth() + 1).padStart(2, '0');
      return dd + '.' + mm + '.' + d.getUTCFullYear();
    }
    function items(first, lines) { return lines.map(function (t, i) { var n = first - i; return { n: n, date: date(n), text: g(t) }; }); }
    var L3 = [
      'Нарада про скорочення нарад тривала дві години. Скоротили наступну.',
      'Ловлю себе на тому, що міряю поля в листі додому.',
      'Пачка прийшла о 03:00. Телефон не дзвонив, я все одно {m:прокинувся|f:прокинулася}.',
      'На нараді є графин. Воду з нього не п’ють. Його наповнюють.',
      'Проєктор у нарадчій не вмикається. Слайди передаємо роздруківкою по колу.',
      'Кава нарешті на своєму місці. Сидить на Нараді, п’є каву, щасливий.',
      'Зведення не б’ється на одиницю. Одиницею виявилась шапка таблиці.',
      '«Погодити із суміжниками». Хто суміжники, не сказано. {m:Погодив|f:Погодила} з сусідами.',
      'Таблицю в Excel просять надіслати сканом. {m:Надрукував|f:Надрукувала}, {m:сканував|f:сканувала}.'
    ].reverse();
    var L3first = ['Двері 214, 214-а і 214-б ведуть в один кабінет. Заходжу в 214-б, так ближче.'];
    var L2 = ['Склад заповнився о другій ночі. Знаю, бо {m:прокинувся|f:прокинулася} без причини.', 'Тумбочкін перевірив кегль лінійкою. Кегль лінійкою не міряють. Він зміряв.'];
    var Q = [
      'Тиждень без телеграм. Кіт спить на порожньому сейфі. Я б теж {m:поспав|f:поспала}.',
      '{m:Викреслив|f:Викреслила} з нотаток «Оператор ЕОМ № 1». Рівно, по лінійці.',
      'Граніт надіслав фото з відпустки. На фото море, резолюції немає.',
      'Дід мовчить четвертий день. {m:Протер|f:Протерла} йому кришку.',
      'Шухляда для телеграм порожня. {m:Поклав|f:Поклала} туди печиво.',
      'Кава приніс каву, а не телеграму. Посиділи.',
      'Перший день без телеграм. {m:Прокинувся|f:Прокинулася} о третій за звичкою. Тихо.'
    ];
    var L5 = ['Лишилась одна паперова ланка. Завтра підпишу останній наказ вручну.', 'Таблиці попередника лежать в одній папці. Читаю їх, як листи.'];
    var groups, count;
    if (st === 'тиждень тиші') {
      groups = [
        { name: 'Тиждень тиші', color: 'var(--accent)', items: items(86, Q) },
        { name: 'Рівень 5 · Армія без паперу', color: 'var(--muted)', items: items(79, L5) }
      ];
      count = '86 записів';
    } else {
      groups = [
        { name: 'Рівень 3 · Командування', color: 'var(--muted)', items: items(28, L3.concat(L3first)) },
        { name: 'Рівень 2 · Бригада', color: 'var(--muted)', items: items(18, L2) }
      ];
      count = '28 записів';
    }
    return {
      groups: groups,
      count: st === 'порожньо' ? '0 записів' : count,
      s: { empty: st === 'порожньо', list: st !== 'порожньо' }
    };
  }
}
</script>
</body>
</html>
