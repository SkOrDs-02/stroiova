<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чип множника</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Unbounded:wght@500;700&amp;display=swap">
</head>
<body>
<div class="st-pv" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">
<section class="st-spec"><h3 class="st-spec-label">Буст із таймером</h3><button class="st-mult" aria-label="Множник ×2, ще 3 години 41 хвилина"><b>×2</b><span>ще 3:41:12</span></button></section>
<section class="st-spec"><h3 class="st-spec-label">Кілька джерел</h3><button class="st-mult" aria-label="Разом ×6 з чотирьох джерел. Відкрити множники"><b>×6</b><span>4 джерела</span></button></section>
<section class="st-spec"><h3 class="st-spec-label">Накопичено до межі</h3><button class="st-mult" aria-label="×2, накопичено 12 годин, це межа"><b>×2</b><span>12 год · межа</span></button></section>
<section class="st-spec"><h3 class="st-spec-label">Постійний</h3><button class="st-mult st-mult--perm" aria-label="Постійний множник ×1,5"><b>×1,5</b><span>назавжди</span></button></section>
</div>
</body>
</html>
