<div class="st-pv" style="grid-template-columns:repeat(auto-fill,minmax(350px,1fr))">

<section class="st-spec"><h3 class="st-spec-label">Генератор · бонус діє · менше 20% · порожній</h3><div class="st-tiles"><button class="st-tile is-bonus" aria-label="Генератор: ще 5 годин, бонус ×1,25"><svg class="st-ico " width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg><span class="st-tile-txt"><span class="st-tile-val">5 год</span><span class="st-tile-cap st-tile-cap--accent">×1,25</span></span></button><button class="st-tile " aria-label="Генератор: ще 65 хвилин, бонус вимкнено"><svg class="st-ico " width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg><span class="st-tile-txt"><span class="st-tile-val">65 хв</span><span class="st-tile-cap ">без бонусу</span></span></button><button class="st-tile " aria-label="Генератор порожній. Заправити безкоштовно"><svg class="st-ico " width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg><span class="st-tile-txt"><span class="st-tile-val">порожньо</span><span class="st-tile-cap st-tile-cap--accent">заправити</span></span></button></div></section>
<section class="st-spec"><h3 class="st-spec-label">Репутація · три рівні словами й стрілкою</h3><div class="st-tiles"><button class="st-tile " aria-label="Репутація: низька"><svg class="st-ico " width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17a8 8 0 0 1 16 0"/><path d="M12 17L7.8 12.8"/><circle cx="12" cy="17" r="1.4"/></svg><span class="st-tile-txt"><span class="st-tile-val">низька</span><span class="st-tile-cap ">репутація</span></span></button><button class="st-tile " aria-label="Репутація: норма"><svg class="st-ico " width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17a8 8 0 0 1 16 0"/><path d="M12 17v-6"/><circle cx="12" cy="17" r="1.4"/></svg><span class="st-tile-txt"><span class="st-tile-val">норма</span><span class="st-tile-cap ">репутація</span></span></button><button class="st-tile " aria-label="Репутація: висока"><svg class="st-ico " width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17a8 8 0 0 1 16 0"/><path d="M12 17l4.2-4.2"/><circle cx="12" cy="17" r="1.4"/></svg><span class="st-tile-txt"><span class="st-tile-val">висока</span><span class="st-tile-cap ">репутація</span></span></button></div></section>
<section class="st-spec"><h3 class="st-spec-label">Папір на нулі · конвеєр не стоїть, чекають лише телеграми</h3><div class="st-tiles"><button class="st-tile " aria-label="Папір: 0 аркушів. Телеграми чекають на папір"><svg class="st-ico " width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l8-4 8 4-8 4z"/><path d="M4 12l8 4 8-4M4 17l8 4 8-4"/></svg><span class="st-tile-txt"><span class="st-tile-val">0</span><span class="st-tile-cap ">аркушів</span></span></button><button class="st-tile is-bonus" aria-label="Генератор: ще 5 годин, бонус ×1,25"><svg class="st-ico " width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg><span class="st-tile-txt"><span class="st-tile-val">5 год</span><span class="st-tile-cap st-tile-cap--accent">×1,25</span></span></button><button class="st-tile " aria-label="Репутація: висока"><svg class="st-ico " width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17a8 8 0 0 1 16 0"/><path d="M12 17l4.2-4.2"/><circle cx="12" cy="17" r="1.4"/></svg><span class="st-tile-txt"><span class="st-tile-val">висока</span><span class="st-tile-cap ">репутація</span></span></button></div></section>
