<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обкладинка журналу</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Unbounded:wght@500;700&amp;display=swap">
</head>
<body>
<div class="st-pv" style="grid-template-columns:repeat(auto-fill,minmax(350px,1fr))">
<section class="st-spec"><h3 class="st-spec-label">Звичайний · рідкісний</h3><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:350px"><button class="st-jr">
  <span class="st-jr-cover" style="--c:var(--cover-olive)"><span class="st-jr-label"><b>Книга</b><span>обліку видавання мила, миття в лазні та заміни білизни</span></span><span class="st-stamp st-stamp--s st-stamp--dark" style="--st-rot:-9deg;--st-edge:100deg;">Скасовано</span></span>
  <span class="st-jr-txt"><span class="st-jr-rar" style="color:var(--rarity-common)">Звичайний</span><span class="st-jr-bonus">+5% до швидкості Стройової частини</span></span>
</button><button class="st-jr">
  <span class="st-jr-cover" style="--c:var(--cover-brown)"><span class="st-jr-label"><b>Книга</b><span>обліку руху осіб, що харчуються</span></span><span class="st-stamp st-stamp--s st-stamp--dark" style="--st-rot:-9deg;--st-edge:100deg;">Скасовано</span></span>
  <span class="st-jr-txt"><span class="st-jr-rar" style="color:var(--rarity-rare)">Рідкісний</span><span class="st-jr-bonus">+10% паперу з кожної поставки</span></span>
</button></div></section>
<section class="st-spec"><h3 class="st-spec-label">Легендарний · замкнено</h3><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:350px"><button class="st-jr st-jr--legend">
  <span class="st-jr-cover" style="--c:var(--cover-black)"><span class="st-jr-label"><b>Книга</b><span>обліку експонатів музеїв, кімнат бойової слави</span></span><span class="st-jr-star"><svg class="st-ico " width="16" height="16" viewBox="0 0 24 24" style="stroke-width:2" role="img" aria-label="Легендарний"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span></span>
  <span class="st-jr-txt"><span class="st-jr-rar" style="color:var(--rarity-legend)">Легендарний</span><span class="st-jr-bonus">×2 до бонусу всіх інших журналів</span></span>
</button><button class="st-jr st-jr--locked" aria-label="Не знайдено. Випадає з телеграм">
  <span class="st-jr-cover"><svg class="st-ico " width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span style="font:500 13px/1 var(--font-mono)">???</span></span>
  <span class="st-jr-txt"><span class="st-jr-rar" style="color:var(--muted);font-weight:500">Не знайдено</span><span class="st-jr-bonus">Випадає з телеграм</span></span>
</button></div></section>
<section class="st-spec"><h3 class="st-spec-label">Інші обкладинки · cover-navy, cover-earth</h3><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:350px"><button class="st-jr">
  <span class="st-jr-cover" style="--c:var(--cover-navy)"><span class="st-jr-label"><b>Стелажні</b><span>(штабельні) ярлики</span></span><span class="st-stamp st-stamp--s st-stamp--dark" style="--st-rot:-9deg;--st-edge:100deg;">Скасовано</span></span>
  <span class="st-jr-txt"><span class="st-jr-rar" style="color:var(--rarity-common)">Звичайний</span><span class="st-jr-bonus">+5% до місткості складу паперу</span></span>
</button><button class="st-jr">
  <span class="st-jr-cover" style="--c:var(--cover-earth)"><span class="st-jr-label"><b>Книга</b><span>обліку призів і подарунків</span></span><span class="st-stamp st-stamp--s st-stamp--dark" style="--st-rot:-9deg;--st-edge:100deg;">Скасовано</span></span>
  <span class="st-jr-txt"><span class="st-jr-rar" style="color:var(--rarity-rare)">Рідкісний</span><span class="st-jr-bonus">Акти на подарунки йдуть на 10% швидше</span></span>
</button></div></section>
</div>
</body>
</html>
