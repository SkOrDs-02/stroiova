<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прогрес</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Unbounded:wght@500;700&amp;display=swap">
</head>
<body>
<div class="st-pv">
<section class="st-spec"><h3 class="st-spec-label">У картці · 4 px</h3><div class="st-card" style="padding:12px"><div class="st-track" role="progressbar" aria-label="До віхи" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100"><i style="--p:72%"></i></div></div></section>
<section class="st-spec"><h3 class="st-spec-label">Готовність до перевірки · 8 px</h3><div class="st-progress"><div class="st-progress-head"><span class="st-progress-label">Готовність до перевірки</span><span class="st-progress-val">60%</span></div><div class="st-track st-track--l" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"><i style="--p:60%"></i></div></div></section>
<section class="st-spec"><h3 class="st-spec-label">Готово · слово, а не лише повна смуга</h3><div class="st-progress"><div class="st-progress-head"><span class="st-progress-label">Готовність до перевірки</span><span class="st-progress-val" style="display:inline-flex;align-items:center;gap:4px"><svg class="st-ico " width="16" height="16" viewBox="0 0 24 24" style="stroke-width:2.4" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>100% · готово</span></div><div class="st-track st-track--l" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"><i style="--p:100%"></i></div></div></section>
<section class="st-spec"><h3 class="st-spec-label">На папері · паста по paper-line</h3><div class="st-paper st-paper--card"><div class="st-progress"><div class="st-progress-head" style="font-size:13px"><span>Підписи</span><b>5 з 8</b></div><div class="st-track st-track--paper" role="progressbar" aria-valuenow="5" aria-valuemin="0" aria-valuemax="8"><i style="--p:62.5%"></i></div></div></div></section>
<section class="st-spec"><h3 class="st-spec-label">Кроки онбордингу · 2 з 3</h3><div class="st-col"><div class="st-steps" role="progressbar" aria-valuenow="2" aria-valuemin="0" aria-valuemax="3"><i class="is-on"></i><i class="is-on"></i><i></i></div><span class="st-spec-label" style="text-align:right">2 з 3</span></div></section>
</div>
</body>
</html>
