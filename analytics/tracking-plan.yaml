# Стройова — план трекінгу аналітики (PostHog)
# Пара до вкладки «Аналітика» дизайн-документа. Лежить у репо гри; джерело правди для типізованої обгортки track().
# Типи: string, integer, number, boolean, object, array<string>, date.
# Великі суми підписів передаємо як log10 (number, 2 знаки): 186400 → 5.27.
# Версія 3: злито доповнення специфікацій 011–014 і 016. Нові події мають поле spec; нові властивості й значення enum
# позначені номером специфікації (spec або «(011)» в описі).
# Тривалості — цілі секунди з суфіксом _sec; булеві — з префіксом is_/has_.

version: 3
plan: stroyova-analytics
updated: "2026-10-09"
destination: posthog_eu_cloud
naming:
  events: "object_action, snake_case, дієслово в теперішньому часі (posthog best practices)"
  properties: "object_adjective, snake_case; is_/has_ для булевих; _sec для тривалостей; _log10 для великих сум; _date для дат"

sdk_config:
  host: "https://eu.i.posthog.com"
  capture_app_lifecycle_events: false
  autocapture_touches: false
  session_replay: false
  persistence: file
  flush_at: 20
  flush_interval_ms: 30000
  max_queue_size: 1000
  flush_on_background: true
  identify: "один раз при першому запуску, distinct_id = install_id (UUID v4)"
  project_settings:
    timezone: "Europe/Kyiv"
    discard_client_ip: true

privacy:
  att_prompt: false
  ump_regions: [EEA, UK, CH]
  ump_form_moment: "перед першим роликом: перший тап «Дивитися», до завантаження реклами"
  analytics_consent: "варіант А: законний інтерес, анонімний install_id, IP не зберігаємо, вимикач «Аналітика» в налаштуваннях (optOut)"
  legal_review: "юрист перед релізом у ЄС"

remote_config:
  economy_scope: new_installs_only
  economy_pinning: "версія конфігу фіксується в збереженні до першої покупки рівня і далі не змінюється"

sampling:
  econ_detail:
    description: "Детальні економічні події лише з частини пристроїв. Вибір детермінований: hash(install_id) mod 100 < econ_detail_sample_pct."
    remote_key: econ_detail_sample_pct
    default_pct: 100
    planned_pct_after_open_release: 20
    events: [upgrade_purchase]
  aggregated_per_session:
    description: "Тапи, покупки рівнів, час без паперу й під бонусом пального не шлемо поштучно, а сумуємо в session_end."
    fields: [taps_count, cat_taps_count, tap_signatures_share_pct, purchases_count, levels_bought, paper_empty_sec, fuel_bonus_sec]

global_properties:
  - {name: economy_config_version, type: string, required: true, example: "econ-v7.2", description: "Версія параметрів економіки, з якою зіграна подія. Для A/B — з суфіксом варіанта, напр. econ-v5.1+b"}
  - {name: economy_config_source, type: string, required: true, enum: [bundled, remote, cached], example: remote, description: "Звідки взято конфіг"}
  - {name: content_version, type: string, required: true, example: "content-2026.10.08", description: "Версія JSON-пакета телеграм, документів і журналів (expo-updates)"}
  - {name: save_schema_version, type: integer, required: true, example: 3, description: "Версія схеми збереження в MMKV"}
  - {name: analytics_plan_version, type: integer, required: true, example: 3, description: "Версія цього плану"}
  - {name: game_session_id, type: string, required: true, example: "9b2f6c1e-7d3a-4c1b-9a51-2f0f3e8d4a10", description: "Наш ідентифікатор сесії (див. session_start); не плутати з $session_id PostHog"}
  - {name: session_number, type: integer, required: true, example: 14, description: "Порядковий номер сесії з моменту встановлення"}
  - {name: playtime_sec, type: integer, required: true, example: 2730, description: "Сумарний час у грі на передньому плані з моменту встановлення"}
  - {name: days_since_install, type: integer, required: true, example: 2, description: "Календарні дні від встановлення за локальним часом пристрою"}
  - {name: level_id, type: string, required: true, enum: [batalion, bryhada, komanduvannia, henshtab, bez_paperu], example: batalion, description: "Поточний рівень гри; komanduvannia, henshtab, bez_paperu — 011, 012, 013"}
  - {name: dub_number, type: integer, required: true, example: 0, spec: "013", description: "Номер Дубля нескінченного режиму; 0 до першого Дубля (013 FR-30)"}
  - {name: is_finale_done, type: boolean, required: true, example: false, spec: "013", description: "Гравець натиснув Y на finale-script (013 FR-18)"}
  - {name: awards_owned, type: integer, required: true, example: 14, spec: "016", description: "Скільки грамот гравець має на мить події (016 FR-25). Потрібна, щоб бачити, чи збігаються грамоти з утриманням"}
  - {name: digitization_count, type: integer, required: true, example: 1, description: "Скільки цифровізацій уже зроблено"}
  - {name: has_no_ads, type: boolean, required: true, example: false, description: "Куплено «Без реклами»"}
  - {name: is_payer, type: boolean, required: true, example: false, description: "Була хоча б одна успішна покупка"}
  - {name: is_econ_detail_sampled, type: boolean, required: true, example: true, description: "Пристрій у вибірці детальних економічних подій"}
  - {name: build_channel, type: string, required: true, enum: [development, preview, production], example: production, description: "Канал збірки EAS / expo-updates"}
  - {name: is_test_user, type: boolean, required: true, example: false, description: "Тестер або розробник; вмикається прихованим меню в налаштуваннях. Фільтруємо з усіх дашбордів"}

events:
  # ---------------- Життєвий цикл ----------------
  - name: app_first_open
    category: lifecycle
    description: "Перший запуск після встановлення."
    trigger: "Старт застосунку, коли в MMKV немає install_id. Генеруємо install_id, викликаємо identify(install_id) з $set_once, потім шлемо подію. Раз на встановлення."
    answers: "Скільки встановлень і з якою версією економіки; точка відліку для когорт, утримання й усіх «часів до»."
    sampling: all
    properties:
      - {name: device_region, type: string, required: true, example: "UA", description: "Регіон із налаштувань пристрою (expo-localization regionCode), не з IP"}
      - {name: device_locale, type: string, required: true, example: "uk-UA", description: "Мова інтерфейсу пристрою"}
      - {name: is_reinstall, type: boolean, required: false, example: false, description: "Лише iOS: у Keychain лишився маркер попереднього встановлення. Прогрес при цьому втрачено, бо хмарних збережень немає"}

  - name: session_start
    category: lifecycle
    description: "Початок ігрової сесії."
    trigger: "Холодний старт або повернення з фону після 120 с і більше. Генеруємо новий game_session_id і збільшуємо session_number. Повернення раніше ніж за 120 с продовжує поточну сесію і цієї події не шле."
    answers: "Скільки сесій на день і в які години; основа DAU та утримання."
    sampling: all
    properties:
      - {name: is_cold_start, type: boolean, required: true, example: false}
      - {name: sec_since_last_session, type: integer, required: false, example: 11520, description: "Від кінця попередньої сесії; немає для першої"}
      - {name: local_hour, type: integer, required: true, example: 21, description: "Година 0–23 за локальним часом пристрою"}
      - {name: entry_point, type: string, required: true, enum: [icon, push, other], example: icon}
      - {name: is_clock_skew_detected, type: boolean, required: true, example: false, description: "Годинник пристрою пішов назад від savedAt (таймери зсунуто, FR-14) або поспішає більш ніж на 1 год від Date відповіді CDN (FR-39): офлайн не зараховано (специфікація 09)"}

  - name: session_end
    category: lifecycle
    description: "Кінець ігрової сесії з агрегатами за сесію."
    trigger: "AppState переходить у background. Шлемо одразу й викликаємо flush(). Якщо гравець повернувся раніше ніж за 120 с, сесія триває, а наступний session_end прийде з тим самим game_session_id і накопиченими значеннями. У звітах беремо останній (максимальний) запис на game_session_id."
    answers: "Тривалість сесії проти пісочниці (4 хв), скільки тапають, де вузьке місце, скільки до наступної покупки, стан економіки на кінець сесії."
    sampling: all
    properties:
      - {name: duration_sec, type: integer, required: true, example: 236, description: "Час на передньому плані за всю сесію, накопичувально"}
      - {name: segment_count, type: integer, required: true, example: 1, description: "Скільки відрізків склали сесію (1 + короткі повернення з фону)"}
      - {name: taps_count, type: integer, required: true, example: 58, description: "Зараховані тапи по печатці; не більше 10 за секунду, зайві не рахуємо"}
      - {name: cat_taps_count, type: integer, required: true, example: 1, description: "Тапи по коту Сейфу з бонусом (5 хв базового доходу, раз на годину)"}
      - {name: tap_signatures_share_pct, type: number, required: true, example: 12.5, description: "Частка підписів сесії, зароблених тапами"}
      - {name: signatures_earned_log10, type: number, required: true, example: 5.27}
      - {name: signatures_balance_log10, type: number, required: true, example: 4.91}
      - {name: income_per_min_log10, type: number, required: true, example: 2.61, description: "Дохід за хвилину в грі з усіма множниками"}
      - {name: idle_income_per_min_log10, type: number, required: true, example: 2.3, description: "Дохід за хвилину без гравця, тобто лише ланки з діловодами"}
      - {name: purchases_count, type: integer, required: true, example: 9, description: "Дії покупки рівнів за сесію (з усіх пристроїв, не лише вибірки)"}
      - {name: levels_bought, type: integer, required: true, example: 27}
      - {name: clerks_hired_count, type: integer, required: true, example: 0}
      - {name: bottleneck_id, type: string, required: true, enum: [streams, kombat, stroy, fin, kazna, narada, dopovid], example: kombat, description: "Що обмежує дохід на кінець сесії: сума потоків чи конкретна ланка труби; narada, dopovid — 011, 012"}
      - {name: next_purchase_eta_sec, type: integer, required: true, example: 5400, description: "Скільки чекати до найближчої покупки, що піднімає дохід, при поточному доході"}
      - {name: digital_points_available, type: integer, required: true, example: 0, description: "Скільки балів дасть цифровізація просто зараз"}
      - {name: levels, type: object, required: true, example: {raporty: 31, akty: 12, dovidky: 0, nakladni: 0, kombat: 24, stroy: 18, fin: 9}, description: "Рівні всіх потоків і ланок; на «Бригаді» додаються nakazy і kazna, на Р3 — zvedennia, narada (011), на Р4–Р5 — zpz, dopovid (012). У HogQL читаємо як properties.levels.raporty"}
      - {name: paper_empty_sec, type: integer, required: true, example: 0, description: "Скільки секунд сесії паперу було 0 (конвеєр від паперу не залежить)"}
      - {name: fuel_bonus_sec, type: integer, required: true, example: 236, description: "Скільки секунд сесії діяв бонус пального ×1,25 (бак > 20%)"}
      - {name: zpz_share_pct, type: number, required: false, example: 18.2, spec: "012", description: "Лише Р4–Р5: частка «Звітів про звіти» на кінець сесії"}
      - {name: stack_cm, type: integer, required: false, example: 64, spec: "012", description: "Лише Р4: висота стосу на кінець сесії, до 999"}

  - name: force_update_show
    category: lifecycle
    description: "Показано блокуючий екран оновлення."
    trigger: "boot показав force-update: встановлена версія нижча за мінімальну з CDN або з кешу, чи збереження новіше за застосунок. Раз на запуск."
    answers: "Скільки гравців застрягли на старій версії і чи доходять вони до стору."
    sampling: all
    properties:
      - {name: reason, type: string, required: true, enum: [min_version, newer_save], example: min_version}
      - {name: installed_version, type: string, required: true, example: "1.0.3"}
      - {name: required_version, type: string, required: true, example: "1.1.0"}
      - {name: is_from_cache, type: boolean, required: true, example: false, description: "Мінімальну версію взято з кешу MMKV, бо CDN не відповів за 2 с"}

  # ---------------- Онбординг ----------------
  - name: onboarding_step_complete
    category: onboarding
    description: "Завершено крок онбордингу з GDD."
    trigger: "Гравець виконав дію, що закриває крок (таблиця кроків у вкладці «Аналітика»). Кожен step_id — не більше одного разу на встановлення. Крок 10 (first_ad_offer) = онбординг пройдено, окремої події немає; крок 11 (пуші) може випасти на другу сесію."
    answers: "На якому кроці відпадають, чи тримаємо таймлайн GDD (0:00 → 9:00) і яка частка доходить до кроку 10 (ціль ≥ 80%)."
    sampling: all
    properties:
      - {name: step_id, type: string, required: true, enum: [title_arrive, intro_finish, callsign_choose, first_act_sign, first_stamp, conveyor_first_upgrade, first_clerk_hire, first_telegram_answer, archaeologist_call, first_ad_offer, push_prompt], example: callsign_choose}
      - {name: step_index, type: integer, required: true, example: 3, description: "1–11 у порядку GDD"}
      - {name: sec_since_first_open, type: integer, required: true, example: 41}
      - {name: step_duration_sec, type: integer, required: true, example: 12, description: "Від завершення попереднього кроку"}
      - {name: is_skipped, type: boolean, required: true, example: false, description: "true лише для intro_finish, якщо натиснули «Пропустити»"}
      - {name: protagonist_gender, type: string, required: false, enum: [m, f], example: f, description: "Лише на callsign_choose: форма протагоніста (він / вона) для текстів. Не персональні дані гравця"}
      - {name: bonus_signatures_log10, type: number, required: false, example: 3.08, description: "Лише на archaeologist_call: бонус архіву, 60 хв базового доходу (archiveBonusMin)"}

  # ---------------- Економіка ----------------
  - name: stream_unlock
    category: economy
    description: "Відкрито новий потік документів."
    trigger: "Рівень потоку змінився з 0 на 1. Для Рапортів, відкритих зі старту циклу, не шлемо."
    answers: "Темп відкриття потоків у кожному циклі проти пісочниці; коли стає доступна цифровізація."
    sampling: all
    properties:
      - {name: stream_id, type: string, required: true, enum: [raporty, akty, dovidky, nakladni, nakazy, zvedennia, zpz], example: akty, description: "nakazy — «Накази по частині», п'ятий потік рівня «Бригада»; zvedennia — 011, zpz — 012"}
      - {name: unlock_index, type: integer, required: true, example: 2, description: "Порядковий номер потоку в циклі: 2–4 на «Батальйоні», 2–5 на «Бригаді», 2–6 на Р3, 2–7 на Р4–Р5"}
      - {name: cost_log10, type: number, required: true, example: 2.48}
      - {name: sec_since_cycle_start, type: integer, required: true, example: 260, description: "Від початку гри або останньої цифровізації"}
      - {name: is_all_streams_open, type: boolean, required: true, example: false, description: "true на останньому потоці рівня (4-му або 5-му): цифровізація стала доступною"}

  - name: upgrade_purchase
    category: economy
    description: "Куплено рівні потоку або ланки труби."
    trigger: "Одна дія покупки — одна подія. Масова покупка (×10, «до віхи») — одна подія. Поодинокі тапи по тій самій цілі з інтервалом до 3 с зливаються в одну подію з сумою levels_bought. Лише на пристроях з is_econ_detail_sampled = true."
    answers: "Що й коли купують гравці, чи б'ють у вузьке місце, як бот у пісочниці, і чи користуються покупкою до віхи."
    sampling: econ_detail
    properties:
      - {name: target_type, type: string, required: true, enum: [stream, stage], example: stage}
      - {name: target_id, type: string, required: true, enum: [raporty, akty, dovidky, nakladni, nakazy, zvedennia, zpz, kombat, stroy, fin, kazna, narada, dopovid], example: kombat, description: "zvedennia, narada — 011; zpz, dopovid — 012"}
      - {name: level_from, type: integer, required: true, example: 18}
      - {name: level_to, type: integer, required: true, example: 25}
      - {name: levels_bought, type: integer, required: true, example: 7}
      - {name: buy_mode, type: string, required: true, enum: [x1, x10, to_milestone], example: to_milestone}
      - {name: cost_log10, type: number, required: true, example: 3.12}
      - {name: was_bottleneck, type: boolean, required: true, example: true, description: "Ціль була вузьким місцем до покупки"}
      - {name: income_before_log10, type: number, required: true, example: 2.4}
      - {name: income_after_log10, type: number, required: true, example: 2.71}

  - name: clerk_hire
    category: economy
    description: "Найнято діловода на потік або ланку."
    trigger: "Успішна покупка діловода, зокрема повторний найм після цифровізації."
    answers: "Час до першого діловода (ціль 3–4 хв гри) і порядок автоматизації."
    sampling: all
    properties:
      - {name: target_type, type: string, required: true, enum: [stream, stage], example: stream}
      - {name: target_id, type: string, required: true, enum: [raporty, akty, dovidky, nakladni, nakazy, zvedennia, zpz, kombat, stroy, fin, kazna, narada, dopovid], example: raporty, description: "zvedennia, narada — 011; zpz, dopovid — 012"}
      - {name: cost_log10, type: number, required: true, example: 1.9}
      - {name: is_first_clerk, type: boolean, required: true, example: true, description: "Перший діловод за все встановлення"}
      - {name: clerks_count_after, type: integer, required: true, example: 1}
      - {name: sec_since_cycle_start, type: integer, required: true, example: 177}

  - name: milestone_reach
    category: economy
    description: "Потік або ланка дійшли до віхи (кожні 25 рівнів, ×2 виробітку)."
    trigger: "Після покупки рівень цілі став кратним 25 уперше в цьому циклі."
    answers: "Як швидко гравці доходять до віх порівняно з пісочницею."
    sampling: all
    properties:
      - {name: target_type, type: string, required: true, enum: [stream, stage], example: stream}
      - {name: target_id, type: string, required: true, enum: [raporty, akty, dovidky, nakladni, nakazy, zvedennia, zpz, kombat, stroy, fin, kazna, narada, dopovid], example: raporty, description: "zvedennia, narada — 011; zpz, dopovid — 012"}
      - {name: level, type: integer, required: true, example: 25}
      - {name: rate_multiplier, type: integer, required: true, example: 2, description: "2^(level/25)"}
      - {name: sec_since_cycle_start, type: integer, required: true, example: 1430}

  # ---------------- Офлайн ----------------
  - name: offline_income_claim
    category: offline
    description: "Гравець забрав офлайн-дохід на екрані повернення."
    trigger: "Закрито екран повернення кнопкою «Забрати» або «Забрати ×2». Подію шлемо лише тоді, коли офлайн-дохід більший за нуль, тобто діловоди є на всіх ланках і хоча б на одному потоці. Стан «Стройова стояла» (сума 0) екран показує, але подію не шле."
    answers: "Скільки доходу губиться на ліміті сховища (ціль ≤ 15%), як часто подвоюють і скільки офлайну йде під бонусом пального. Переведений годинник — у session_start."
    sampling: all
    properties:
      - {name: away_sec, type: integer, required: true, example: 27720}
