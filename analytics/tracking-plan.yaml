      - {name: save_schema_to, type: integer, required: false, example: 3, description: "Для save_migration"}

  # ---------------- Пачки телеграм (011) ----------------
  - name: telegram_pack_receive
    category: telegrams
    spec: "011 FR-17, FR-18"
    description: "Пачка з трьох телеграм лягла у вхідні."
    trigger: "Настала 03:00 за часом пристрою на Р3; якщо гравця не було — при поверненні. Окремо від неї надсилаються три telegram_receive."
    answers: "Чи доходить одна пачка на добу і скільки пачок пропущено через ліміт «Нових»."
    sampling: all
    properties:
      - {name: pack_id, type: string, required: true, example: "pack_03"}
      - {name: pack_number, type: integer, required: true, example: 3, description: "Номер «Зведення № N» у грі"}
      - {name: is_repeat, type: boolean, required: true, example: false}
      - {name: delivery, type: string, required: true, enum: [live, while_away], example: while_away}

  - name: telegram_pack_resolve
    category: telegrams
    spec: "011 FR-19–FR-22"
    description: "Усі три телеграми пачки мають відповідь."
    trigger: "Остання з трьох відповідей застосована (зведена або окрема)."
    answers: "Чи справжній вибір між зведенням і окремими відповідями; скільки паперу й репутації він коштує."
    sampling: all
    properties:
      - {name: pack_id, type: string, required: true, example: "pack_03"}
      - {name: mode, type: string, required: true, enum: [summary, separate, mixed], example: summary}
      - {name: choice_kind, type: string, required: false, enum: [diligent, formal_reply, drawer], example: diligent, description: "Лише для summary"}
      - {name: paper_spent, type: integer, required: true, example: 4}
      - {name: reputation_delta, type: integer, required: true, example: 10}
      - {name: inspection_chance_pct, type: number, required: true, example: 0}
      - {name: is_beats, type: boolean, required: true, example: true, description: "Пачка закрита «сумлінно» (для пункту summary_beats)"}
      - {name: sec_since_received, type: integer, required: true, example: 21600}

  # ---------------- Стос «Звітів про звіти» (012) ----------------
  - name: stack_meter_reach
    category: economy
