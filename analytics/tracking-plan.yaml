  # ---------------- Пуші ----------------
  - name: push_permission_request
    category: notifications
    description: "Пройдено сценарій запиту дозволу на пуші."
    trigger: "Гравець відповів на наш екран-пояснення («Скажемо, коли склад заповниться…») і, якщо погодився, на системний запит. Кількість подій = скільки разів запит показано, os_result = відповідь."
    answers: "Скільки гравців дозволяє пуші і чи не відштовхує їх наш екран."
    sampling: all
    properties:
      - {name: trigger, type: string, required: true, enum: [onboarding_session_end, settings, storage_full_hint], example: onboarding_session_end}
      - {name: pre_prompt_result, type: string, required: true, enum: [accepted, declined], example: accepted}
      - {name: os_result, type: string, required: true, enum: [granted, denied, provisional, not_shown], example: granted}

  - name: push_open
    category: notifications
    description: "Гравець відкрив гру з локального пуша."
    trigger: "Тап по сповіщенню відкрив застосунок."
    answers: "Які пуші повертають гравців і як швидко."
    sampling: all
    properties:
      - {name: push_type, type: string, required: true, enum: [storage_full, telegram_new, inspection, inspection_passed, race_reminder, race_won, boost_end, fuel_bonus_end, kombat_found, gift_arrived], example: storage_full, description: "Каталог сповіщень № 1–10 специфікації 10; fuel_bonus_end — не частіше разу на день"}
      - {name: delay_sec, type: integer, required: true, example: 1260, description: "Від запланованого часу пуша до тапу"}

  # ---------------- Налаштування й помилки ----------------
  - name: setting_change
    category: settings
    description: "Змінено налаштування."
    trigger: "Гравець змінив перемикач у налаштуваннях або підписав скидання прогресу (progress_reset, new_value = done, до стирання; digitization_count і playtime_sec — з глобальних властивостей). Для analytics = off шлемо подію, робимо flush(), потім optOut()."
    answers: "Які налаштування чіпають; скільки вимикають звук, вібрацію, категорії сповіщень і аналітику; скільки скидають прогрес."
    sampling: all
    properties:
      - {name: setting_name, type: string, required: true, enum: [sound, haptics, notif_storage, notif_telegrams, notif_inspections, notif_gifts, notif_boosts, analytics, ads_privacy_options, progress_reset], example: haptics}
      - {name: new_value, type: string, required: true, example: "off"}

  - name: app_error_log
    category: errors
    description: "Помилка, важлива для гри або грошей."
    trigger: "Збій завантаження, запису чи міграції збереження, некоректний конфіг економіки, помилка SDK реклами, згоди, покупок, пушів, оновлень або рендеру картинки. Відновлення з копії на save-error — source = save_load, recovery = backup_slot. Деталі й стек — у Sentry, сюди лише код."
    answers: "Скільки гравців втрачають прогрес і де ламаються SDK, у розрізі версій."
    sampling: all
    properties:
      - {name: source, type: string, required: true, enum: [save_load, save_write, save_migration, economy_config, admob, ump, revenuecat, notifications, expo_updates, share_render], example: save_load, description: "share_render — не вдалося відмалювати картинку для «Поділитися» (07)"}
      - {name: error_code, type: string, required: true, example: "parse_error"}
      - {name: is_recovered, type: boolean, required: true, example: true}
      - {name: recovery, type: string, required: true, enum: [backup_slot, defaults, retry, none], example: backup_slot}
      - {name: message_short, type: string, required: false, example: "Unexpected token at 1043", description: "До 120 символів, без позивного й інших даних гравця"}
      - {name: save_schema_from, type: integer, required: false, example: 2, description: "Для save_migration"}
      - {name: save_schema_to, type: integer, required: false, example: 3, description: "Для save_migration"}

