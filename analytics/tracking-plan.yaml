    answers: "Чи трапляється перша перевірка наприкінці першого дня і скільки позапланових дає відписка. Позапланова ×3 не дає, лише ризик провалу."
    sampling: all
    properties:
      - {name: inspection_id, type: string, required: true, example: "insp_0004"}
      - {name: inspection_number, type: integer, required: true, example: 4}
