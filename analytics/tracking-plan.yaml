    properties:
      - {name: inspection_id, type: string, required: true, example: "insp_0004"}
      - {name: result, type: string, required: true, enum: [passed, failed], example: passed}
      - {name: items_done, type: integer, required: true, example: 5}
      - {name: items_total, type: integer, required: true, example: 5}
      - {name: is_completed_via_ad, type: boolean, required: true, example: false}
      - {name: is_resolved_offline, type: boolean, required: true, example: true}
      - {name: sec_from_start, type: integer, required: true, example: 8040}
      - {name: inspection_kind, type: string, required: true, enum: [regular, final], example: final, spec: "011"}
      - {name: is_mechanic_item_done, type: boolean, required: false, example: true, spec: "011", description: "Лише для final: пункт механіки рівня виконано на мить приїзду"}
      - {name: is_level_exit_unlocked, type: boolean, required: false, example: true, spec: "011", description: "Лише для final: levelExitAllowed став true"}
      - {name: zpz_share_pct, type: number, required: false, example: 42.5, spec: "012", description: "Лише Р4: частка «Звітів про звіти» від суми інших потоків на мить приїзду"}
      - {name: is_without_remarks, type: boolean, required: true, example: true, spec: "016", description: "Пройдено без зауважень (04 FR-18). Потрібно для лічильників insp_clean і insp_clean_streak"}
      - {name: level_id, type: string, required: true, enum: [batalion, bryhada, komanduvannia, henshtab, bez_paperu], example: bryhada, spec: "016", description: "Рівень перевірки. Потрібно для умов aw_boss_r2, aw_boss_r3, aw_boss_r4, aw_insp_r5"}

  # ---------------- Гонка з часом ----------------
  - name: race_start
    category: race
    description: "Почалась гонка з часом за подарунок волонтерів."
    trigger: "Волонтерка Ліна привезла подарунок, запущено обидва таймери: документ на конвеєрі й ресурс на фронті."
    answers: "Скільки гонок можна виграти без прискорень і чи не задовгі документи."
    sampling: all
    properties:
      - {name: race_id, type: string, required: true, example: "race_0017"}
      - {name: gift_type, type: string, required: true, enum: [drone, shovel, generator], example: drone}
      - {name: doc_sec_required, type: integer, required: true, example: 27000, description: "Час акта: дрон ≈ 7 год 30 хв, лопати 6 год 40 хв, генератор 11 год 20 хв"}
      - {name: resource_sec_left, type: integer, required: true, example: 32400, description: "Служба подарунка: дрон 9 год, лопати 12 год, генератор 10 год"}
      - {name: is_winnable_without_speedup, type: boolean, required: true, example: false}

  - name: race_speedup_apply
    category: race
    description: "Документ у гонці прискорено."
    trigger: "Застосовано прискорення: «Послатися на цифру» (−2 год, раз за гонку, при P_total ≥ 1, бали не списуються), реклама або «Забрати» з «Без реклами» (після ad_reward_grant). Прискорення діловодом — поза MVP."
    answers: "Чим прискорюють гонку і чи потрібна для неї реклама."
    sampling: all
    properties:
      - {name: race_id, type: string, required: true, example: "race_0017"}
      - {name: method, type: string, required: true, enum: [digital_bonus, ad, no_ads_pass], example: ad}
      - {name: sec_saved, type: integer, required: true, example: 9360, description: "digital_bonus — 7200"}
      - {name: speedups_count_after, type: integer, required: true, example: 1}

  - name: race_finish
    category: race
    description: "Гонка завершилась."
    trigger: "Документ пройшов конвеєр або ресурс скінчився раніше. Якщо без гравця, подія шлеться при поверненні."
    answers: "Частка виграних гонок і запас часу."
    sampling: all
    properties:
      - {name: race_id, type: string, required: true, example: "race_0017"}
      - {name: result, type: string, required: true, enum: [success, fail], example: success}
      - {name: margin_sec, type: integer, required: true, example: 43200, description: "Додатне — встигли із запасом, від'ємне — на скільки не встигли"}
      - {name: speedups_count, type: integer, required: true, example: 1}
      - {name: is_ad_used, type: boolean, required: true, example: true}
      - {name: is_resolved_offline, type: boolean, required: true, example: false}
      - {name: gift_type, type: string, required: true, enum: [drone, shovel, generator], example: drone, spec: "016", description: "Дублює race_start, щоб умову грамоти aw_race_all_gifts і звіти не треба було з'єднувати за race_id"}
      - {name: level_id, type: string, required: true, enum: [batalion, bryhada, komanduvannia, henshtab, bez_paperu], example: komanduvannia, spec: "016", description: "Рівень гонки. Потрібно для лічильника race_won_on_r3"}

