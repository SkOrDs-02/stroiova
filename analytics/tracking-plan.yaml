      - {name: recovery, type: string, required: true, enum: [backup_slot, defaults, retry, none], example: backup_slot}
      - {name: message_short, type: string, required: false, example: "Unexpected token at 1043", description: "До 120 символів, без позивного й інших даних гравця"}
