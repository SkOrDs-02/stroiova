      - {name: digitizations_on_level, type: integer, required: true, example: 0}
      - {name: sec_since_level_start, type: integer, required: true, example: 5400}
      - {name: sec_since_available, type: integer, required: true, example: 3600, description: "Від моменту, коли конвертація стала доступною"}

  - name: finale_step_complete
