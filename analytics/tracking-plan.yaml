    answers: "Скільки гравців тапає «Дивитися» і скільки чекають на завантаження."
    sampling: all
    properties:
      - {name: placement, type: string, required: true, enum: [income_boost, offline_double, race_speedup, inspection_checklist], example: offline_double}
      - {name: ad_flow_id, type: string, required: true, example: "3f1c0e2a-8b4d-4f6e-9c7a-1d2e3f4a5b6c"}
      - {name: load_wait_ms, type: integer, required: true, example: 350, description: "Від тапу до показу"}

  - name: ad_complete
    category: ads
    description: "Рекламу переглянуто до нагороди."
