      - {name: error_code, type: string, required: false, example: "3", description: "Код AdMob, напр. 3 = немає реклами"}
      - {name: error_domain, type: string, required: false, example: "com.google.admob"}

  - name: ad_reward_grant
    category: ads
    description: "Нагорода за рекламу зарахована в грі."
    trigger: "Після ad_complete і закриття оголошення, або одразу після тапу «Забрати» для власників «Без реклами» (is_no_ads_claim = true; ad_start і ad_complete тоді не шлемо)."
    answers: "Скільки нагород реально отримано і яку частку дає «Без реклами»."
    sampling: all
    properties:
      - {name: placement, type: string, required: true, enum: [income_boost, offline_double, race_speedup, inspection_checklist], example: income_boost}
      - {name: ad_flow_id, type: string, required: true, example: "3f1c0e2a-8b4d-4f6e-9c7a-1d2e3f4a5b6c"}
