      - {name: reward_unit, type: string, required: true, enum: [boost_sec, signatures_log10, race_sec, checklist_items], example: boost_sec}
      - {name: reward_amount, type: number, required: true, example: 14400}

  - name: ads_consent_update
    category: ads
    description: "Оновлено рекламну згоду (Google UMP)."
    trigger: "Показано й закрито форму UMP або змінився статус згоди: перед першим роликом (лише ЄЕЗ, Британія, Швейцарія), при запуску чи з налаштувань приватності. Якщо статус не змінився і форми не було — не шлемо."
    answers: "Яка частка гравців у регіонах зі згодою і скільки з них не можуть дивитися рекламу."
    sampling: all
    properties:
      - {name: trigger, type: string, required: true, enum: [first_ad_watch, app_launch, privacy_settings], example: first_ad_watch}
      - {name: consent_status, type: string, required: true, enum: [obtained, required, not_required, unknown], example: obtained}
      - {name: is_form_shown, type: boolean, required: true, example: true}
      - {name: is_ads_request_allowed, type: boolean, required: true, example: true, description: "Значення canRequestAds з UMP"}
      - {name: is_privacy_options_required, type: boolean, required: true, example: true, description: "UMP вимагає кнопку налаштувань приватності"}

  # ---------------- Покупки ----------------
  - name: shop_view
    category: iap
    description: "Показано вітрину товарів: магазин або модалку starter-offer."
    trigger: "Показано екран «Магазин» з будь-якого входу або модалку starter-offer з черги модалок (source = starter_offer, раз за встановлення)."
    answers: "Звідки приходять у магазин і яка конверсія з перегляду в покупку."
    sampling: all
    properties:
      - {name: source, type: string, required: true, enum: [tab, offline_storage_link, starter_pack_card, starter_offer, ad_limit_reached, boost_card], example: tab}
      - {name: is_starter_pack_available, type: boolean, required: true, example: true, description: "«Стартовий набір» ще не куплено. Без таймерів і бейджів"}

  - name: purchase_start
    category: iap
    description: "Розпочато покупку."
    trigger: "Тап по ціні, викликано покупку в RevenueCat."
    answers: "Інтерес до кожного товару і частка тих, хто доходить до оплати."
    sampling: all
    properties:
      - {name: product_id, type: string, required: true, enum: [no_ads, starter_pack, storage_24h], example: no_ads}
      - {name: price, type: number, required: true, example: 199, description: "Ціна з магазину в локальній валюті"}
      - {name: currency, type: string, required: true, example: "UAH", description: "ISO 4217"}
      - {name: source, type: string, required: true, enum: [tab, offline_storage_link, starter_pack_card, starter_offer, ad_limit_reached, boost_card], example: tab}

  - name: purchase_complete
    category: iap
    description: "Покупку підтверджено."
    trigger: "RevenueCat повернув успіх, товар видано."
    answers: "Конверсія в покупку (ціль ≥ 1,5%), мікс товарів, коли купують."
