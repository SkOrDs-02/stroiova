    trigger: "Рушій сюжету віддав крок із черги, і носій (записка, тост, дзвінок, сцена, телеграма тощо) став видимим."
    answers: "Чи доходять арки, скільки кроків наздоганяють і як довго вони чекають у черзі."
    sampling: all
    properties:
      - {name: beat_id, type: string, required: true, example: "st_who_writes_05"}
      - {name: arc, type: string, required: true, enum: [who_writes, archaeologist, ptashka, kombat_leave, cat, tumbochkin, transition, finale], example: who_writes}
      - {name: carrier, type: string, required: true, enum: [telegram, note, call, event_toast, curio, scene, archive_sheet, share_card, insp_act_line, credits_line, character_state], example: note}
