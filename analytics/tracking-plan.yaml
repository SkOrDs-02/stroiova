  # ---------------- Грамоти (016) ----------------
  - name: award_unlock
    category: awards
    spec: "016 FR-17–FR-24, FR-34"
    description: "Гравець отримав грамоту, подяку або оголошення в наказі."
    trigger: "Умова грамоти з content/awards.json виконалась, грамоту записано в збереження. Одна подія на грамоту. Грамоти, видані «заднім числом» після оновлення контенту, шлються при завантаженні з is_retroactive = true."
    answers: "Чи тримається темп «одна грамота на 1–2 дні» (оцінка estDayAds проти фактичного дня), які категорії не відкривають і які приховані знаходять."
    sampling: all
    properties:
      - {name: award_id, type: string, required: true, example: "aw_tg_50", description: "id з content/awards.json"}
      - {name: award_category, type: string, required: true, enum: [progress, telegrams, inspections, race, museum, curios, cat, clerks, hidden], example: telegrams}
      - {name: award_type, type: string, required: true, enum: [gramota, podyaka, nakaz], example: podyaka}
      - {name: is_hidden, type: boolean, required: true, example: false, description: "Прихована (пасхалка або спойлер)"}
      - {name: awards_owned_after, type: integer, required: true, example: 15}
      - {name: is_retroactive, type: boolean, required: true, example: false, description: "Видано при завантаженні після оновлення контенту, умову виконано раніше"}
      - {name: is_resolved_offline, type: boolean, required: true, example: false, description: "Умову виконано подією, що сталася без гравця (перевірка, гонка), видано при поверненні"}
      - {name: is_mirrored, type: boolean, required: true, example: true, description: "Грамота має дзеркало в Game Center / Play Games"}
      - {name: sec_since_install, type: integer, required: true, example: 1382400}

  - name: awards_wall_open
    category: awards
    spec: "016 FR-25–FR-29"
    description: "Відкрито стіну грамот (сегмент «Грамоти» музею)."
    trigger: "Показано сегмент «Грамоти»: перемикачем сегментів, з тосту грамоти або з особової справи. Не частіше разу на 60 с для того самого джерела."
    answers: "Чи дивляться на грамоти взагалі, чи працює тост як вхід."
    sampling: all
    properties:
      - {name: source, type: string, required: true, enum: [segment, award_toast, profile], example: award_toast}
      - {name: awards_owned, type: integer, required: true, example: 15}
      - {name: awards_unseen, type: integer, required: true, example: 1, description: "Отримані, але ще не показані на стіні"}

  - name: award_platform_sync
    category: awards
    spec: "016 FR-38–FR-44"
    description: "Результат синхронізації грамот із Game Center (iOS) або Google Play Ігри (Android)."
    trigger: "Закінчилась спроба входу або звіту в платформу: на старті після онбордингу, при новій грамоті з дзеркалом, при ввімкненні перемикача. Не частіше разу на сесію з тим самим result, крім першого входу."
    answers: "Скільки гравців мають дзеркало, скільки відмовляються від входу і скільки звітів зависає в черзі."
    sampling: all
    properties:
      - {name: platform, type: string, required: true, enum: [game_center, play_games], example: game_center}
      - {name: result, type: string, required: true, enum: [synced, not_signed_in, sign_in_cancelled, disabled, error], example: synced, description: "disabled — перемикач вимкнено; error — деталі в app_error_log з source = platform_awards"}
      - {name: reported_count, type: integer, required: true, example: 2, description: "Скільки грамот звітовано в цій спробі"}
      - {name: pending_count, type: integer, required: true, example: 0, description: "Скільки лишилось у черзі після спроби"}
      - {name: is_first_sign_in, type: boolean, required: true, example: false}

