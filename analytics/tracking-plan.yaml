    answers: "Реальні перегляди на DAU (ціль ≥ 1,5) і дохід з реклами, якщо ввімкнено дохід за показ."
    sampling: all
    properties:
      - {name: placement, type: string, required: true, enum: [income_boost, offline_double, race_speedup, inspection_checklist], example: offline_double}
      - {name: ad_flow_id, type: string, required: true, example: "3f1c0e2a-8b4d-4f6e-9c7a-1d2e3f4a5b6c"}
      - {name: watch_ms, type: integer, required: true, example: 30500}
      - {name: ad_value_micros, type: integer, required: false, example: 4200, description: "З події оплати показу AdMob, якщо ввімкнено impression-level ad revenue"}
      - {name: ad_value_currency, type: string, required: false, example: "USD"}
      - {name: ad_value_precision, type: string, required: false, enum: [estimated, publisher_provided, precise, unknown], example: estimated}

  - name: ad_fail
    category: ads
    description: "Збій між тапом «Дивитися» і нагородою."
    trigger: "Реклама не готова, не завантажилась, не показалась, закрита до нагороди або заблокована відсутністю згоди."
    answers: "Fill rate і втрати на кожному місці."
    sampling: all
    properties:
      - {name: placement, type: string, required: true, enum: [income_boost, offline_double, race_speedup, inspection_checklist], example: race_speedup}
      - {name: ad_flow_id, type: string, required: true, example: "3f1c0e2a-8b4d-4f6e-9c7a-1d2e3f4a5b6c"}
