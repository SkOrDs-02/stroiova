      - {name: reputation_after, type: integer, required: true, example: 65}
      - {name: inspection_chance_pct, type: number, required: true, example: 0}
      - {name: paper_spent, type: integer, required: true, example: 2}
      - {name: sec_since_open, type: integer, required: true, example: 14}
      - {name: pack_id, type: string, required: false, example: "pack_03", spec: "011", description: "Лише для телеграм пачки Р3"}
      - {name: is_pack_summary, type: boolean, required: false, example: true, spec: "011", description: "Відповідь дано зведенням «Звести в одну відповідь»; ефекти в цій події — частка телеграми, сума — у telegram_pack_resolve"}

  - name: telegram_flag
