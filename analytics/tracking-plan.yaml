    description: "Стос «Звітів про звіти» вперше в циклі досяг 100 см."
    trigger: "Висота стосу перетнула 100 см; раз на цикл цифровізації. Запис «Метр звітів» створено в Журналі курйозів."
    answers: "Чи досягають метра в типовій сесії і чи поширюють цей запис."
    sampling: all
    properties:
      - {name: zpz_share_pct, type: number, required: true, example: 35.0}
      - {name: zpz_level, type: integer, required: true, example: 24}
      - {name: sec_since_session_start, type: integer, required: true, example: 180}
      - {name: offline_share_pct, type: number, required: true, example: 80.0, description: "Яку частку висоти дав офлайн на початку сесії"}

  # ---------------- Р5, фінал і Дублі (013) ----------------
  - name: stage_convert
    category: digitization
    spec: "013 FR-4–FR-8"
    description: "Паперову ланку перетворено на цифрову."
    trigger: "Підтверджено «Оцифрувати ланку» в stage-convert, підписи списано, стан збережено."
    answers: "Темп конвертацій на Р5 і чи не стала ціна стіною."
    sampling: all
    properties:
      - {name: stage_id, type: string, required: true, enum: [kombat, stroy, fin, kazna, narada, dopovid], example: kombat}
