      - {name: method, type: string, required: true, enum: [signatures, ad, no_ads_pass, condition], example: signatures, description: "condition (011) — пункт механіки підсумкової, перевірений на мить приїзду; шлеться разом з inspection_finish"}
      - {name: cost_log10, type: number, required: false, example: 3.08, description: "Немає для ad і no_ads_pass"}
      - {name: sec_to_deadline, type: integer, required: true, example: 5100}

  - name: inspection_finish
    category: inspections
    description: "Комісія приїхала, результат визначено."
    trigger: "Таймер перевірки дійшов до нуля. Якщо це сталося без гравця, подія шлеться при поверненні з is_resolved_offline = true."
    answers: "Частка пройдених перевірок, чи по кишені чекліст без реклами."
