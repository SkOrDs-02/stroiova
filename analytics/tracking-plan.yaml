      - {name: choice_kind, type: string, required: true, enum: [diligent, formal_reply, drawer, special], example: diligent}
      - {name: slowdown_target_id, type: string, required: false, enum: [raporty, akty, dovidky, nakladni, nakazy, zvedennia, zpz, kombat, stroy, fin, kazna, narada, dopovid], example: stroy, description: "Потік або ланка, яку сповільнює вибір (№ 18, 19, 29 сповільнюють потоки); немає, якщо ефекту немає. zvedennia, narada — 011; zpz, dopovid — 012"}
